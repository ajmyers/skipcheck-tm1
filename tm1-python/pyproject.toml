[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tm1-client"
version = "0.1.0.dev0"
description = "Python client for the IBM Planning Analytics (TM1) REST API, generated from its $metadata"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Ruff is pinned: a newer one may lay code out differently, and tests/test_format.py checks the layout
test = ["pytest>=8", "ruff==0.17.6"]

[tool.hatch.build.hooks.custom]
# hatch_build.py generates src/tm1_client/_generated from ../spec/tm1-api.json, and
# src/tm1_client/_sync (the sync flavor) from src/tm1_client/aio

[tool.hatch.build.targets.wheel]
packages = ["src/tm1_client"]
artifacts = ["src/tm1_client/_generated/*.py", "src/tm1_client/_sync/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src", "codegen", "tests", "coverage", "hatch_build.py"]
exclude = ["src/tm1_client/_generated", "src/tm1_client/_sync"]

[tool.hatch.build.targets.sdist.force-include]
# The sdist builds without the repository, so it takes the spec along
"../spec/tm1-api.json" = "spec/tm1-api.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
