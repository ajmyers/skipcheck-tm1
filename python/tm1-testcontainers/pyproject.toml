[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skipcheck-tm1-testcontainers"
version = "0.1.0.dev0"
description = "Testcontainers support for running IBM Planning Analytics (TM1) servers in tests"
readme = "README.md"
license = "Apache-2.0"
# hatch_build.py copies them here from the repository root; an sdist carries them
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    # Tm1Version is part of this package's API (Tm1ServerContainer.with_expected_version)
    "skipcheck-tm1",
    "testcontainers>=4.15",
    "httpx>=0.27,<1",
    "typing-extensions>=4.7",
    # The markers and fixtures are a pytest plugin, as Java's are JUnit extensions
    "pytest>=8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points.pytest11]
skipcheck_tm1_testcontainers = "skipcheck_tm1_testcontainers.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/skipcheck_tm1_testcontainers"]

[tool.hatch.build.hooks.custom]
# hatch_build.py ships docker/paw/paw-local.sh in the package: PawContainer runs it in its runner
# container, as the Java build puts it in the jar. An editable install reads it from the repository.

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "hatch_build.py"]
# Copied here by hatch_build.py and not committed, so named as artifacts
artifacts = ["/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
