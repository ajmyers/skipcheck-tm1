name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  # The Python client, generated from spec/tm1-api.json; the build job above fails when that
  # spec is out of date with the $metadata snapshot (ApiSpecTest)
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # tm1-testcontainers too: the live tests start TM1 with it (skipped here, with no TM1 source)
      - run: pip install -e './tm1-python[test]' -e './tm1-python/testcontainers[test]'
      - run: pytest tm1-python

  # The .NET client, generated from spec/tm1-api.json at build time
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tm1-dotnet/Tm1.slnx
