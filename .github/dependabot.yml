# Weekly version updates, grouped so each ecosystem opens one PR per week.
# The PR conventions aren't checked on Dependabot's PRs: it writes its own titles (see pr-conventions.yml).
#
# Every ecosystem the repository builds with is here. One that's left out gets no updates until a
# security alert, and then several at once: the TypeScript workspace's first eight arrived that way.
version: 2
updates:
  # Covers gradle/libs.versions.toml, which also pins the build-logic plugins.
  # Keep spring-framework and jackson aligned with what spring-boot manages.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Jackson moves with Spring Boot: an application using the client resolves Boot's version,
      # so a newer minor here is tested against a combination nobody runs. Jackson 3.3 also
      # changes the order of @JsonAnySetter maps, which the conformance fixtures record.
      - dependency-name: "tools.jackson*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  # The TypeScript workspace (one lock file for the client and its testcontainers), and the API
  # docs site. Versions in typescript/package.json are pinned exactly, so every update is a PR.
  - package-ecosystem: npm
    directories:
      - /typescript
      - /api-site
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]

  # Ruff and Pyright are pinned in tm1-client's test extra: a newer one may lay code out
  # differently or report more, so each bump comes with whatever it reformats or finds.
  - package-ecosystem: pip
    directories:
      - /python/tm1-client
      - /python/tm1-testcontainers
    schedule:
      interval: weekly
      day: monday
    groups:
      pip:
        patterns: ["*"]

  # The projects' packages, and CSharpier in dotnet-tools.json. CSharpier.MsBuild in
  # Directory.Build.props has to stay the same version as the tool.
  - package-ecosystem: nuget
    directories:
      - /dotnet
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        patterns: ["*"]

  # The images' base images
  - package-ecosystem: docker
    directories:
      - /docker/tm1-server
      - /docker/tm1-web
      - /docker/cognos-server
      - /docker/pa-setup
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
