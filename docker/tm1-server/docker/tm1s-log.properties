# TM1 server message logging. The shared memory appender is read by
# shared_memory_reader.exe, which writes tm1server.log in the data directory
# (the entrypoint tails that file to stdout) and backs the REST API's
# MessageLogEntries endpoint. IBM's log4cxx build has no ConsoleAppender.
log4j.logger.TM1=INFO, S1
log4j.appender.S1=org.apache.log4j.SharedMemoryAppender
log4j.appender.S1.MemorySize=5 MB
log4j.appender.S1.MaxFileSize=100 MB
log4j.appender.S1.MaxBackupIndex=20
log4j.appender.S1.TimeZone=GMT
