# Build, smoke-test and publish Docker images to GitHub Container Registry (ghcr.io).
#
#   Pull request:   build + smoke test only, nothing is pushed.
#   Push to master: publishes :edge and :sha-<short sha>.
#   Tag v1.2.3:     publishes :1.2.3, :1.2 and :latest (same tags as the Maven release).
#                   Pre-release tags (v1.2.3-rc.1) publish only :1.2.3-rc.1.
#
# Publishing is switched on per image with a repository variable (Settings -> Secrets
# and variables -> Actions -> Variables), named in the image's matrix entry:
#
#   gh variable set PUBLISH_DOCKER_TM1_SERVER --body true    # start publishing tm1-server
#   gh variable delete PUBLISH_DOCKER_TM1_SERVER             # stop again
#
# Until its variable is "true", an image is still built and smoke-tested on every
# run but never pushed.
#
# Images are published as ghcr.io/<repo owner>/<image>. They're linked to this repo
# through the org.opencontainers.image.source label. The first time an image is
# published, set it to Public under Packages -> <image> -> Package settings.
# No secrets needed: pushes use the workflow's GITHUB_TOKEN.
#
# Adding an image: add an entry to the matrix below.
#   image:       name under ghcr.io/<owner>/
#   context:     directory with the Dockerfile (the Docker build context)
#   file:        optional: the Dockerfile, when it isn't <context>/Dockerfile
#   smoke-test:  optional: the smoke test, when it isn't <context>/ci-smoke-test.sh
#   platforms:   target platforms, e.g. linux/amd64,linux/arm64
#   gradle-task: optional Gradle task to run first, e.g. ":tools:foo:bootJar" for a
#                Spring Boot tool whose Dockerfile copies build/libs/*.jar
#   publish-var: repository variable that switches publishing on for this image,
#                PUBLISH_DOCKER_<IMAGE NAME, upper case, - as _>
# If <context>/ci-smoke-test.sh exists, it runs against the built image
# (argument: the image reference). A non-zero exit fails the build.
name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tm1-server
            context: docker/tm1-server
            platforms: linux/amd64   # TM1 Server is x86-64 only
            gradle-task: ''          # plain Dockerfile, nothing to build with Gradle first
            publish-var: PUBLISH_DOCKER_TM1_SERVER
          - image: tm1-web
            context: docker/tm1-web
            platforms: linux/amd64   # TM1 Web's bundled Java is x86-64 only
            gradle-task: ''
            publish-var: PUBLISH_DOCKER_TM1_WEB
          - image: cognos-server
            context: docker/cognos-server
            platforms: linux/amd64   # Cognos Analytics for Linux is x86-64 only
            gradle-task: ''
            publish-var: PUBLISH_DOCKER_COGNOS_SERVER
          - image: pa-setup
            context: docker                       # it ships docker/paw/paw-local.sh
            file: docker/pa-setup/Dockerfile
            smoke-test: docker/pa-setup/ci-smoke-test.sh
            platforms: linux/amd64,linux/arm64    # no IBM software: runs natively everywhere
            gradle-task: ''
            publish-var: PUBLISH_DOCKER_PA_SETUP
          # Example for a Spring Boot tool (Dockerfile in tools/foo copies build/libs/*.jar):
          # - image: tm1-foo
          #   context: tools/foo
          #   platforms: linux/amd64,linux/arm64
          #   gradle-task: ':tools:foo:bootJar'
          #   publish-var: PUBLISH_DOCKER_TM1_FOO
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      PUSH: ${{ github.event_name != 'pull_request' && vars[matrix.publish-var] == 'true' }}
    steps:
      - name: Publishing ${{ github.event_name != 'pull_request' && vars[matrix.publish-var] == 'true' && 'enabled' || 'disabled' }}
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "Will push $IMAGE"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Pull request: build and smoke test only"
          else
            echo "::notice title=${{ matrix.image }} not published::Set the repository variable ${{ matrix.publish-var }}=true to publish $IMAGE"
          fi

      - uses: actions/checkout@v5

      - name: Set up Java (Gradle-built images only)
        if: matrix.gradle-task
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - if: matrix.gradle-task
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle ${{ matrix.gradle-task }}
        if: matrix.gradle-task
        run: ./gradlew ${{ matrix.gradle-task }}

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, ',')
      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=edge,branch=master
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0

      # Build once for the runner's platform and load it locally, so it can be smoke-tested.
      - name: Build (for testing)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test
        run: |
          script="${{ matrix.smoke-test || format('{0}/ci-smoke-test.sh', matrix.context) }}"
          if [ -f "$script" ]; then bash "$script" "${{ matrix.image }}:ci"; else echo "No $script, skipping"; fi

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ env.IMAGE }}
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  # The check the master ruleset requires for the images: it passes only when every image above
  # built and passed its smoke test (see ci-ok in ci.yml, which this is to the image matrix)
  docker-ok:
    if: always()
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every image built and passed its smoke test
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "image: $RESULT"
          test "$RESULT" = success
