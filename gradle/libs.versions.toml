[versions]
# Keep spring-framework and jackson in step with what spring-boot manages
spring-boot = "4.2.0"
spring-framework = "7.1.0"
jackson = "3.1.8"
junit = "6.1.3"
assertj = "3.27.7"
hamcrest = "3.0"
spring-dependency-management = "1.1.7"
maven-publish = "0.37.0"
lombok = "1.18.48"
freefair-lombok = "9.8.3"
spring-javaformat = "0.0.48"
archunit = "1.5.1"
javapoet = "0.23.0"
errorprone = "2.53.0"
errorprone-plugin = "5.2.0"
nullaway = "0.14.4"
jspecify = "1.0.1"
testcontainers = "2.0.5"
# YAML 1.1, as PyYAML: tm1-testcontainers reads pa-setup's pa-environment.yaml as pa_setup.py does
snakeyaml = "2.7"
# Keep reactor in step with what spring-webflux brings in
reactor = "3.9.0"
reactor-netty = "1.4.0"
# Keep slf4j and micrometer in step with what spring-boot manages
slf4j = "2.0.20"
micrometer = "1.18.0"

[libraries]
spring-web = { module = "org.springframework:spring-web", version.ref = "spring-framework" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring-framework" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http", version.ref = "reactor-netty" }
reactor-test = { module = "io.projectreactor:reactor-test", version.ref = "reactor" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
micrometer-observation = { module = "io.micrometer:micrometer-observation", version.ref = "micrometer" }
micrometer-observation-test = { module = "io.micrometer:micrometer-observation-test", version.ref = "micrometer" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "spring-boot" }
spring-boot-webclient = { module = "org.springframework.boot:spring-boot-webclient", version.ref = "spring-boot" }
spring-boot-http-client = { module = "org.springframework.boot:spring-boot-http-client", version.ref = "spring-boot" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers", version.ref = "spring-boot" }
spring-boot-micrometer-observation = { module = "org.springframework.boot:spring-boot-micrometer-observation", version.ref = "spring-boot" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

# Gradle plugins, as dependencies of build-logic
gradle-plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradle-plugin-spring-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
gradle-plugin-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
spring-javaformat-formatter = { module = "io.spring.javaformat:spring-javaformat-formatter-shaded", version.ref = "spring-javaformat" }
gradle-plugin-errorprone = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
gradle-plugin-freefair-lombok = { module = "io.freefair.gradle:lombok-plugin", version.ref = "freefair-lombok" }
