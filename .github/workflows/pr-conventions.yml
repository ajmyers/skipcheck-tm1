# PRs are squash-merged: the PR title and description become the commit on master.
# Check them against the same conventions as the commit-msg hook (.githooks/check_message.py).
name: PR Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check PR title and description
        # Passed via env, never interpolated into the script, so PR text can't inject shell
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-message"
          # Dependabot PRs are generated and carry their own context (changelog, version range),
          # so they skip the issue-link rule; their titles are still checked
          flags=""
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then flags="--no-issue"; fi
          python3 .githooks/check_message.py pr $flags "$RUNNER_TEMP/pr-message"
