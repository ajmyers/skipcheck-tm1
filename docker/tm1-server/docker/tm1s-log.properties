# TM1 server logging. Every appender is a SharedMemoryAppender: TM1 writes to a
# shared-memory buffer and shared_memory_reader.exe writes the file in /tm1/logs.
# The main log also backs the REST API's MessageLogEntries, and the entrypoint tails
# tm1server.log to stdout (IBM's log4cxx build has no ConsoleAppender).
#
# Buffers are kept small (5 MB each) to keep memory use low on a dev/test server.

# Main server log: tm1server.log
log4j.logger.TM1=INFO, S1
log4j.appender.S1=org.apache.log4j.SharedMemoryAppender
log4j.appender.S1.MemorySize=5 MB
log4j.appender.S1.MaxFileSize=100 MB
log4j.appender.S1.MaxBackupIndex=5
log4j.appender.S1.TimeZone=GMT

# Event log (needs EventLogging=T in tm1s.cfg): tm1event.log
log4j.logger.Event=INFO, S_Event
log4j.appender.S_Event=org.apache.log4j.SharedMemoryAppender
log4j.appender.S_Event.MemorySize=5 MB
log4j.appender.S_Event.MaxFileSize=50 MB
log4j.appender.S_Event.MaxBackupIndex=2
log4j.appender.S_Event.File=tm1event.log
log4j.appender.S_Event.Format=TM1Event

# Lock details, including the names of locked objects: tm1lock.log
log4j.logger.TM1.Lock.Exception=DEBUG, S_Lock
log4j.additivity.TM1.Lock.Exception=true
log4j.appender.S_Lock=org.apache.log4j.SharedMemoryAppender
log4j.appender.S_Lock.MemorySize=5 MB
log4j.appender.S_Lock.MaxFileSize=50 MB
log4j.appender.S_Lock.MaxBackupIndex=2
log4j.appender.S_Lock.File=tm1lock.log

# Every login: tm1login.log
log4j.logger.TM1.Login=DEBUG, S_Login
log4j.additivity.TM1.Login=true
log4j.appender.S_Login=org.apache.log4j.SharedMemoryAppender
log4j.appender.S_Login.MemorySize=5 MB
log4j.appender.S_Login.MaxFileSize=50 MB
log4j.appender.S_Login.MaxBackupIndex=2
log4j.appender.S_Login.File=tm1login.log
