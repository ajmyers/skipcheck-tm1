# Publish each project's landing page, docs and API reference to skipcheck.io/<project>/ (see
# api-site/README.md).
#
#   Every change: tests the Worker, builds the themed Javadoc and bundles the Worker; deploys
#                 nothing. It runs as part of CI (ci.yml calls it), under the required ci-ok check.
#   Tag v1.2.3:   deploys that version's docs, alongside the Maven Central release. The release
#                 workflow calls this one for a tag, after its gate: a tag doesn't start it
#                 directly, or docs would ship for a release that didn't.
#   Manual run:   deploys the chosen branch (e.g. master, before the first release).
#
# Repo secrets needed to deploy:
#   CLOUDFLARE_API_TOKEN   - Workers Scripts: Edit (account) and Workers Routes: Edit (skipcheck.io, skipcheck.dev)
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account
name: API Docs

on:
  # ci.yml calls this for every change: it tests the Worker, builds the site and bundles the
  # Worker, and deploys nothing. release.yml calls it for a tag, with deploy
  workflow_call:
    inputs:
      deploy:
        description: Deploy the site, rather than only build it and bundle the Worker
        type: boolean
        default: false
  # By hand, it deploys the chosen branch
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site, rather than only build it and bundle the Worker
        type: boolean
        default: true

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the Worker
        working-directory: api-site
        run: npm test

      - name: Build the themed Javadoc
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew apiSiteJavadoc -Pversion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew apiSiteJavadoc
          fi

      - name: Assemble the site
        working-directory: api-site
        # A release's pages name its version: the install steps, and no pre-release notice
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export DOCS_VERSION="${GITHUB_REF_NAME#v}"
          fi
          npm ci
          npm run assemble

      - name: Bundle the Worker (no deploy)
        if: ${{ !inputs.deploy }}
        working-directory: api-site
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      - name: Deploy
        if: ${{ inputs.deploy }}
        working-directory: api-site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
