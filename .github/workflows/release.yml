# Release: the Java libraries to Maven Central, the Python packages to PyPI and the .NET packages
# to NuGet.
#
#   Real release: push a tag like v0.1.0. Publishes that version everywhere, permanently.
#   Dry run:      run this workflow manually (Actions tab, or `gh workflow run release.yml`).
#                 Maven: uploads 0.0.0-dryrun.<run number> to the Central Portal for validation but
#                 does NOT release it. Check it under Deployments, then Drop it.
#                 Python and .NET: builds and checks the packages, and uploads nothing.
#   Pre-release:  a manual run with python_version (0.1.0.dev1, 0.1.0rc1) or dotnet_version
#                 (0.1.0-dev.1, 0.1.0-rc.1) set publishes that version to PyPI or NuGet. A version
#                 can never be reused on either, even after deleting it.
#
# Repo secrets needed:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  - Central Portal user token
#   SIGNING_KEY / SIGNING_KEY_PASSWORD               - ASCII-armored GPG private key
# PyPI and NuGet need none: each trusts this workflow by name (PyPI: each project's Publishing
# settings; NuGet: the account's Trusted Publishing policy for Skipcheck.*), so renaming this file
# breaks publishing. NuGet also needs the repository variable NUGET_USER, the nuget.org user name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: Which registries to run
        type: choice
        options: [all, maven, python, dotnet]
        default: all
      python_version:
        description: Publish this pre-release to PyPI (e.g. 0.1.0.dev1). Empty builds without publishing.
        type: string
        default: ''
      dotnet_version:
        description: Publish this pre-release to NuGet (e.g. 0.1.0-dev.1). Empty builds without publishing.
        type: string
        default: ''

jobs:
  publish:
    if: github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'maven'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6

      - name: Choose version and publish task
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "task=publishAndReleaseToMavenCentral" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "task=publishToMavenCentral" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ steps.plan.outputs.version }}
        run: ./gradlew build ${{ steps.plan.outputs.task }} -Pversion=${{ steps.plan.outputs.version }} --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # One job per package, so one can be run again without the other
  python:
    if: github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [tm1-client, tm1-testcontainers]
    permissions:
      contents: read
      # PyPI takes this job's identity token instead of a password (trusted publishing)
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Choose version
        id: plan
        # Passed via env, never interpolated into the script, so the input can't inject shell
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$PYTHON_VERSION" ]; then
            # Only a pre-release by hand: a final version comes from a tag, with the other languages
            if ! printf '%s' "$PYTHON_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(\.dev|a|b|rc)[0-9]+$'; then
              echo "python_version must be a pre-release such as 0.1.0.dev1 or 0.1.0rc1, not '$PYTHON_VERSION'" >&2
              exit 1
            fi
            echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0.dev$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ steps.plan.outputs.version }}
        working-directory: python/${{ matrix.package }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          grep -q "^version = \"$VERSION\"" pyproject.toml
          python -m pip install --quiet build twine
          python -m build --outdir "$GITHUB_WORKSPACE/dist"
          python -m twine check --strict "$GITHUB_WORKSPACE"/dist/*

      - name: Publish ${{ steps.plan.outputs.version }} to PyPI
        if: steps.plan.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  dotnet:
    if: github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'dotnet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # NuGet takes this job's identity token instead of a stored API key (trusted publishing)
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Choose version
        id: plan
        env:
          DOTNET_VERSION: ${{ inputs.dotnet_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DOTNET_VERSION" ]; then
            # Only a pre-release by hand: a final version comes from a tag, with the other languages
            if ! printf '%s' "$DOTNET_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$'; then
              echo "dotnet_version must be a pre-release such as 0.1.0-dev.1 or 0.1.0-rc.1, not '$DOTNET_VERSION'" >&2
              exit 1
            fi
            echo "version=$DOTNET_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # The client and its testcontainers: the only packable projects of the solution
      - name: Pack ${{ steps.plan.outputs.version }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          dotnet pack dotnet/Tm1.slnx -c Release -o nupkg "-p:Version=$VERSION"
          ls nupkg
          test "$(ls nupkg/*.nupkg | wc -l)" -eq 2

      - name: Log in to NuGet
        if: steps.plan.outputs.publish == 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish ${{ steps.plan.outputs.version }} to NuGet
        if: steps.plan.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'nupkg/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
