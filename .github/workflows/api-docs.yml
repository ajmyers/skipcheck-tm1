# Publish the Java API docs and the guide to skipcheck.io/projects/ (see api-site/README.md).
#
#   Pull request: builds the themed Javadoc and bundles the Worker; deploys nothing.
#   Tag v1.2.3:   deploys that version's docs, alongside the Maven Central release.
#   Manual run:   deploys the chosen branch (e.g. master, before the first release).
#
# Repo secrets needed to deploy:
#   CLOUDFLARE_API_TOKEN   - Workers Scripts: Edit (account) and Workers Routes: Edit (skipcheck.io, skipcheck.dev)
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account
name: API Docs

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'api-site/**'
      # The guide's prose is the Java types' Javadoc, and its examples are each language's
      - 'java/**'
      - 'python/**/examples/**'
      - 'dotnet/examples/**'
      - 'typescript/**/examples/**'
      - 'build-logic/**'
      - 'gradle.properties'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the themed Javadoc
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew apiSiteJavadoc -Pversion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew apiSiteJavadoc
          fi

      - name: Assemble the site
        working-directory: api-site
        run: |
          npm ci
          npm run assemble

      - name: Bundle the Worker (no deploy)
        if: github.event_name == 'pull_request'
        working-directory: api-site
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      - name: Deploy
        if: github.event_name != 'pull_request'
        working-directory: api-site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
