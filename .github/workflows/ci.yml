name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces the run before it; every push to master runs to the end
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  # Every source file starts with its license line; scripts/license-headers.py says which files
  # those are. The clients' own builds check their languages; this covers the rest too.
  license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/license-headers.py

  # The Python client, generated from spec/tm1-api.json; the build job above fails when that
  # spec is out of date with the $metadata snapshot (ApiSpecTest)
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # tm1-testcontainers too: the live tests start TM1 with it (skipped here, with no TM1 source)
      - run: pip install -e './python/tm1-client[test]' -e './python/tm1-testcontainers[test]'
      # Also checks layout and lint (tests/test_format.py, python/ruff.toml), as the Java
      # build's checkFormat and Error Prone
      - run: pytest python

  # The .NET client, generated from spec/tm1-api.json at build time
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test dotnet/Tm1.slnx

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # The oldest Node the packages support, and the current LTS
        node: ['22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # The client and, as an npm workspace, tm1-testcontainers: each script
      # runs both. The live and container tests are skipped here, with no TM1 source
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # The scripts under docker/, which have workflows of their own. They run on every change, not
  # only one to their folder: a required check can't wait for a workflow that didn't start, and
  # each takes under a minute
  paw:
    uses: ./.github/workflows/paw.yml

  setup-scripts:
    uses: ./.github/workflows/setup-scripts.yml

  # The one check the master ruleset requires: it passes only when every job above did, whatever
  # their matrices are called. It always runs: a job that's skipped because one it needs failed
  # would count as passing. A new job goes in its needs.
  ci-ok:
    if: always()
    needs: [build, license, python, dotnet, typescript, paw, setup-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
