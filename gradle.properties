# Coordinates for everything published from this repo: io.skipcheck:<module>:<version>
group=io.skipcheck
version=0.1.0-SNAPSHOT

# Used for POM <url>/<scm>. TODO: confirm GitHub owner before first release
githubRepo=ajmyers/skipcheck-tm1

# Where the docs site publishes each module's Javadoc: <apiSiteBaseUrl><module>/api/java/
apiSiteBaseUrl=https://skipcheck.io/

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
